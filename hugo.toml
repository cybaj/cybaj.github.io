baseURL = 'https://cybaj.github.io/'
languageCode = 'en-us'
title = 'HELLO'

theme = "hugo-book"

# Book configuration
disablePathToLower = true
enableGitInfo = true


# Google Analytics. The theme calls Hugo's embedded google_analytics template,
# which reads this. Must be a GA4 id — Hugo warns and renders nothing for a
# Universal Analytics "ua-" id, which stopped collecting in July 2023.
#
# This table has to sit below the bare keys above: a TOML table captures every
# bare key that follows it, so placing it higher would turn disablePathToLower
# and enableGitInfo into services.googleAnalytics settings.
[services]
[services.googleAnalytics]
id = 'G-77BD0H9V3G'

# respectDoNotTrack defaults to true, so the tag is withheld from visitors
# whose browser sends Do Not Track. Set it false only deliberately.
[privacy]
[privacy.googleAnalytics]
respectDoNotTrack = true


# Needed for mermaid/katex shortcodes
[markup]
[markup.goldmark.renderer]
unsafe = true

[markup.tableOfContents]
startLevel = 1


[caches]
[caches.images]
dir = ':cacheDir/images'


[languages]
[languages.en]
contentDir = 'content/english'
languageName = 'English'
weight = 10
[languages.ko]
contentDir = 'content/korean'
languageName = '한국어'
weight = 20

# Sidebar links below the document tree, alongside Blog (weight 5, set in
# content/{lang}/posts/_index.md). One definition serves both languages, and
# hugo-book adds target=_blank rel=noopener to any entry without a page.
# Weights are spaced by ten so entries can be reordered without renumbering.

[[menu.after]]
  name = "emotional view"
  url = "https://cybaj.github.io/blue-sober/"
  weight = 10

[[menu.after]]
  name = "GitHub (cybaj)"
  url = "https://github.com/cybaj"
  weight = 20

[[menu.after]]
  name = "GitHub (tomatofromsky)"
  url = "https://github.com/tomatofromsky"
  weight = 30

[[menu.after]]
  name = "Instagram"
  url = "https://www.instagram.com/skywisegram/"
  weight = 40
